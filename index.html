<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Perfect Stop</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#071a50,#020612 55%,#02040a);color:white;font-family:Arial,sans-serif}.app{width:min(94vw,500px);min-height:100vh;margin:auto;padding:22px 12px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;font-weight:bold;font-size:21px;letter-spacing:3px}.gold{color:#a76c0b}.level{text-align:center;color:#a76c0b;font-size:23px;margin:20px 0}.label{text-align:center;color:#aaa;font-size:20px}.target{text-align:center;font-size:76px;font-weight:bold}.timer{text-align:center;font-size:112px;font-weight:bold;margin:20px 0}button{border:0}.main{height:110px;border-radius:28px;background:#555;color:#fff;font-size:38px;font-weight:bold}.result{text-align:center;font-size:27px;font-weight:bold;min-height:75px;margin:18px 0}.hint{font-size:18px;color:#aaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid #11192d;border-radius:20px;text-align:center;padding:12px 3px}.stat b{display:block;color:#aa7916;font-size:24px}.rank{margin-top:auto;border:1px solid #11192d;border-radius:20px;padding:15px}.row{display:flex;justify-content:space-between;padding:5px}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center}.hide{display:none}.box{width:min(88vw,380px);background:#080e23;border:1px solid #1b2747;border-radius:18px;padding:22px;text-align:center}.box input{width:100%;padding:14px;background:#10172d;border:1px solid #26304d;border-radius:9px;color:#fff;font-size:18px;margin:15px 0}.play{width:100%;padding:14px;border-radius:9px;font-weight:bold}.err{color:#ff6075;height:20px}</style></head>
<body><div class="app"><header><span>PERFECT STOP</span><span>🏆 <i id="pts">0</i></span></header><div class="level" id="lvl"></div><div class="label">ARRÊTE LE TEMPS À</div><div class="target" id="target"></div><div class="timer" id="timer">0.000</div><button class="main" id="btn">START</button><div class="result" id="res">À toi de jouer !</div><div class="stats"><div class="stat"><b id="best">—</b>MEILLEUR</div><div class="stat"><b id="wins">0</b>RÉUSSIS</div><div class="stat"><b id="tries">0</b>ESSAIS</div></div><div class="rank"><b>🌍 CLASSEMENT N<span id="rn">1</span></b><div id="rows"></div></div></div>
<div class="modal" id="login"><div class="box"><h2>PERFECT STOP</h2><p>Choisis ton pseudo.</p><input id="name" maxlength="14" placeholder="Ton pseudo"><div class="err" id="err"></div><button class="play" id="play">JOUER</button></div></div>
<script>
const L=[["PRÉCISION",10,null,.20],["DISPARITION",9,5,.20],["MÉMOIRE",8,2,.20],["FLASH",7,1,.15],["EXTRÊME",6,.6,.10]];
let lv=+(localStorage.lv||1),pts=+(localStorage.pts||0),w=0,tr=0,run=false,start=0,raf,name=localStorage.psName||"";
const q=x=>document.getElementById(x), bk=()=>`best${lv}`;
function render(){let a=L[lv-1];q("lvl").textContent=`NIVEAU ${lv} • ${a[0]}`;q("target").textContent=a[1].toFixed(2);q("pts").textContent=pts;q("rn").textContent=lv;q("wins").textContent=w;q("tries").textContent=tr;let b=localStorage[bk()];q("best").textContent=b?Number(b).toFixed(3)+"s":"—";rank()}
function rank(){let b=JSON.parse(localStorage["board"+lv]||"[]");q("rows").innerHTML=b.slice(0,5).map((x,i)=>`<div class="row"><span>${["🥇","🥈","🥉"][i]||i+1+"."} ${x.n}</span><span class="gold">${x.s.toFixed(3)}s</span></div>`).join("")||'<div class="hint">Fais le premier record !</div>'}
function tick(t){if(!run)return;let s=(t-start)/1000,a=L[lv-1];q("timer").textContent=a[2]!=null&&s>=a[2]?"•••":s.toFixed(3);raf=requestAnimationFrame(tick)}
function begin(){run=true;start=performance.now();q("btn").textContent="STOP";q("res").textContent="";raf=requestAnimationFrame(tick)}
function stop(){run=false;cancelAnimationFrame(raf);tr++;let s=(performance.now()-start)/1000,a=L[lv-1],d=Math.abs(s-a[1]);q("timer").textContent=s.toFixed(3);q("btn").textContent="REJOUER";let b=localStorage[bk()];if(!b||d<+b)localStorage[bk()]=d;let h=s<a[1]?"Trop tôt — attends davantage":"Trop tard — appuie plus tôt";if(d<=a[3]){w++;let add=d<=.05?25:d<=.1?10:5;pts+=add;localStorage.pts=pts;q("res").innerHTML=`${d<=.05?"🔥":"✅"} ${d.toFixed(3)}s • +${add}<div class="hint">${h}</div>`;save(d);if(w>=2&&lv<5){lv++;localStorage.lv=lv;w=tr=0;q("res").innerHTML=`🏆 NIVEAU ${lv} DÉBLOQUÉ !`}}else q("res").innerHTML=`❌ ${d.toFixed(3)}s • objectif ≤ ${a[3].toFixed(2)}s<div class="hint">${h}</div>`;render()}
function save(s){let k="board"+lv,b=JSON.parse(localStorage[k]||"[]"),x=b.find(x=>x.n.toLowerCase()==name.toLowerCase());if(!x)b.push({n:name,s});else if(s<x.s)x.s=s;b.sort((a,c)=>a.s-c.s);localStorage[k]=JSON.stringify(b.slice(0,20))}
q("btn").onclick=()=>run?stop():begin;q("play").onclick=()=>{let n=q("name").value.trim();if(n.length<3){q("err").textContent="3 caractères minimum";return}name=n;localStorage.psName=n;q("login").classList.add("hide");render()};if(name)q("login").classList.add("hide");render();
</script></body></html>
